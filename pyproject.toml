[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flashpack"
version = "1.0.0"
description = "Pack a project into a single budgeted XML or Markdown snapshot for web AI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "flashpack" }]
dependencies = []

[project.optional-dependencies]
tokens = ["tiktoken>=0.7"]
ast = ["tree-sitter>=0.21", "tree-sitter-language-pack>=0.7"]
all = ["tiktoken>=0.7", "tree-sitter>=0.21", "tree-sitter-language-pack>=0.7"]

[project.scripts]
flashpack = "flashpack.cli:main"

[tool.setuptools.packages.find]
include = ["flashpack*"]
